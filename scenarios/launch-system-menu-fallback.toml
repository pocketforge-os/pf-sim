[scenario]
name = "launch-system-menu-fallback"
description = "Launch Ridgeline, then prove providerless Menu fallback under tsp-ihne1.36."
profile = "seeded-default"
scale = "100"
contrast = "default"

[[steps]]
op = "launch"
item = "org.pocketforge.ridgeline"
[[steps]]
op = "wait_for"
predicate = "session_state == launching"
[[steps]]
op = "capture"
name = "launch-dim"
[[steps]]
op = "wait_for"
predicate = "app_state == running"
[[steps]]
op = "capture"
name = "in-app"
[[steps]]
op = "system_menu"
[[steps]]
op = "wait_for"
predicate = "last_receipt == Returned"
[[steps]]
op = "capture"
name = "returned"
