name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y weston libxkbcommon-dev pkg-config python3-pil
      - name: Enable uinput
        run: |
          sudo modprobe uinput
          sudo chmod 666 /dev/uinput
          echo 'SUBSYSTEM=="input", KERNEL=="event*", ATTRS{name}=="pocketforge-sim-gamepad:*", MODE="0666"' | sudo tee /etc/udev/rules.d/99-pf-sim-gamepad.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --subsystem-match=input
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo
            ~/.local/state/pf-sim/toolchain/target
          key: pf-sim-toolchain-${{ hashFiles('pins.toml') }}
      - name: Compile Python
        run: python3 -m compileall -q pf_sim tests
      - name: Unit tests
        env:
          PF_SIM_REQUIRE_UINPUT: "1"
        run: python3 -m unittest discover -s tests -v
      - name: Build toolchain
        run: ./pf-simctl toolchain build
      - name: Doctor
        env:
          XDG_RUNTIME_DIR: ${{ runner.temp }}/xdg
        run: mkdir -p "$XDG_RUNTIME_DIR" && ./pf-simctl doctor
      - name: Repeatable desktop lifecycle
        env:
          XDG_RUNTIME_DIR: ${{ runner.temp }}/xdg
        run: |
          mkdir -p "$XDG_RUNTIME_DIR"
          ./pf-simctl up --display headless
          ./pf-simctl input action Search.open
          ./pf-simctl text sun
          ./pf-simctl capture ci-search-sun
          python3 -c 'import json,pathlib; p=pathlib.Path.home()/".local/state/pf-sim/captures/default/ci-search-sun.scene.json"; s=json.loads(p.read_text()); assert s["search_query"]=="sun"; assert s["search_result_ids"]==["sunwake"]'
          ./pf-simctl text --clear
          ./pf-simctl input action Move.down
          ./pf-simctl capture ci-moved
          python3 -c 'import json,pathlib; p=pathlib.Path.home()/".local/state/pf-sim/captures/default"; assert json.loads((p/"ci-search-sun.scene.json").read_text())["focused"] != json.loads((p/"ci-moved.scene.json").read_text())["focused"]'
          ./pf-simctl capture --repeat 2 ci-det | grep 'deterministic=true'
          ./pf-simctl profile apply controller-battery-low
          ./pf-simctl capture ci-batt
          python3 -c 'import json,pathlib; s=json.loads((pathlib.Path.home()/".local/state/pf-sim/captures/default/ci-batt.scene.json").read_text()); assert "Controller battery low" in json.dumps(s)'
          ./pf-simctl profile apply first-run
          ./pf-simctl capture ci-first-run
          ./pf-simctl profile apply seeded-default --scale 200 --contrast hc
          ./pf-simctl capture ci-seeded-default
          ./pf-simctl profile apply degraded-authority
          ./pf-simctl capture ci-degraded-authority
          python3 -c 'from pathlib import Path; from PIL import Image; from pf_sim.capture import is_blank,sha256; p=Path.home()/".local/state/pf-sim/captures/default"; f=[p/("ci-"+n+".png") for n in ("first-run","seeded-default","degraded-authority")]; assert all(Image.open(x).size==(1280,720) and not is_blank(x) for x in f); assert sha256(f[0]) != sha256(f[1])'
          ./pf-simctl status --json
          ./pf-simctl down
          ./pf-simctl up --display headless --profile seeded-default
          ./pf-simctl launch ridgeline
          for n in $(seq 1 50); do ./pf-simctl app status | grep -q 'app_status=running' && break; sleep .1; done
          ./pf-simctl app status | grep 'app_status=running'
          ./pf-simctl history --json | grep '"receipt": null'
          ./pf-simctl app crash
          for n in $(seq 1 50); do ./pf-simctl history --json | grep -q 'Crash' && break; sleep .1; done
          ./pf-simctl history --json | grep 'Crash'
          ./pf-simctl launch hollow-tides
          ./pf-simctl safe-return
          for n in $(seq 1 50); do ./pf-simctl history | grep -q 'Returned' && break; sleep .1; done
          ./pf-simctl history | grep 'Returned'
          ./pf-simctl down
      - name: Dump simulator failure evidence
        if: failure()
        run: |
          find "$HOME/.local/state/pf-sim/runs" -type f \( -path '*/logs/*.log' -o -name run.json \) -print0 2>/dev/null | while IFS= read -r -d '' file; do
            echo "===== $file ====="
            sed -n '1,400p' "$file"
          done
