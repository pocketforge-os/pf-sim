name: pf-sim scenarios

on:
  workflow_call:
    inputs:
      pf_sim_ref:
        description: pf-sim revision to check out (defaults to the current workflow run SHA)
        required: false
        type: string
        default: ""
      launcher_ref:
        description: Launcher commit to build (defaults to pins.toml)
        required: false
        type: string
        default: ""
      scenarios:
        description: Scenario file glob
        required: false
        type: string
        default: "scenarios/*.toml"
      matrix_only:
        description: Optional product-010 matrix filter
        required: false
        type: string
        default: ""
      repeat:
        description: Number of scenario repetitions
        required: false
        type: number
        default: 1
  workflow_dispatch:
    inputs:
      pf_sim_ref:
        description: pf-sim revision to check out (defaults to the current workflow run SHA)
        required: false
        type: string
        default: ""
      launcher_ref:
        description: Launcher commit to build
        required: false
        type: string
        default: ""
      scenarios:
        description: Scenario file glob
        required: false
        type: string
        default: "scenarios/*.toml"
      matrix_only:
        description: Optional product-010 matrix filter
        required: false
        type: string
        default: ""
      repeat:
        description: Number of scenario repetitions
        required: false
        type: number
        default: 1

jobs:
  scenarios:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Configure temporary paths
        run: |
          echo "PF_SIM_HOME=$RUNNER_TEMP/pf-sim-home" >> "$GITHUB_ENV"
          echo "XDG_RUNTIME_DIR=$RUNNER_TEMP/xdg" >> "$GITHUB_ENV"
      - name: Check out pf-sim
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: pocketforge-os/pf-sim
          ref: ${{ inputs.pf_sim_ref || github.sha }}
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y weston libxkbcommon-dev pkg-config python3-pil python3-yaml
      - name: Stage strict resolver fixtures
        run: sudo ./scripts/strict-resolver-fixtures.sh install /
      - name: Workflow lint and action pin guard
        run: |
          python3 - <<'PY'
          import pathlib, re, yaml
          files = list(pathlib.Path('.github/workflows').glob('*.yml'))
          for path in files:
              yaml.safe_load(path.read_text())
              for line in path.read_text().splitlines():
                  match = re.search(r'\buses:\s*([^\s#]+)', line)
                  if match and not match.group(1).startswith('./'):
                      assert re.search(r'@[0-9a-f]{40}$', match.group(1)), f'{path}: unpinned {match.group(1)}'
          PY
      - name: Wrapper is cwd-independent
        run: cd /tmp && "$GITHUB_WORKSPACE/pf-simctl" --help >/dev/null
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo
            ${{ runner.temp }}/pf-sim-home/toolchain/target
          key: pf-sim-toolchain-${{ inputs.launcher_ref || hashFiles('pins.toml') }}
      - name: Compile and test
        run: |
          python3 -m compileall -q pf_sim tests
          python3 tests/uinput_inventory.py --self-test
          unit_home="$(mktemp -d)"
          trap 'rm -rf "$unit_home"' EXIT
          PF_SIM_HOME="$unit_home" python3 -m unittest discover -s tests -v
      - name: Build selected launcher toolchain
        env:
          LAUNCHER_REF: ${{ inputs.launcher_ref }}
        run: |
          if [ -n "$LAUNCHER_REF" ]; then
            ./pf-simctl toolchain build --launcher-rev "$LAUNCHER_REF"
          else
            ./pf-simctl toolchain build
          fi
      - name: Doctor
        run: mkdir -p "$XDG_RUNTIME_DIR" && ./pf-simctl doctor
      - name: Enforce P0 host-input quarantine
        # Scenario/matrix routes previously created a runner-host uinput device
        # and some audits used the host display. They stay frozen until
        # tsp-ihne1.56.5 migrates them to private event/display sources.
        run: |
          python3 -m unittest -v tests/test_uinput_domain.py
          python3 tests/uinput_inventory.py --self-test
      - name: Reap simulator processes
        if: always()
        run: ./pf-simctl down --reap-orphans
      - name: Remove strict resolver fixtures
        if: always()
        run: |
          if sudo test -f /opt/pocketforge/apps/.pf-sim-fixtures; then
            sudo ./scripts/strict-resolver-fixtures.sh remove /
          fi
      - name: Upload scenario and measurement evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pf-sim-scenario-reports
          path: |
            ${{ runner.temp }}/pf-sim-home/scenarios
            matrix-report
            *.audit.txt
          if-no-files-found: warn
